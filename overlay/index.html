<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII Aquarium — OBS Overlay</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" class="day">
      <header id="hud">
        <div class="hud-row">
          <span id="brand">≈ ASCII AQUARIUM ≈</span>
          <span id="phase">Jour</span>
          <span id="counts">🐟 0 · * 0</span>
          <span id="mode" class="pill">dry-run</span>
        </div>
        <div class="hud-row hud-event">
          <span id="banner"></span>
          <span id="last"></span>
        </div>
      </header>
      <pre id="tank" aria-label="aquarium"></pre>
      <div id="catch" hidden></div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
