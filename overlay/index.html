<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1" />
    <title>ASCII Aquarium — OBS Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" class="day">
      <header id="hud">
        <div class="hud-left">
          <span id="brand" class="chip brand">≈ Aquarium</span>
          <span id="phase" class="chip">Jour</span>
          <span id="counts" class="chip">0 · 0</span>
          <span id="mode" class="chip pill">dry-run</span>
        </div>
        <div class="hud-right">
          <span id="last" class="chip quiet"></span>
        </div>
      </header>
      <div id="event-bar" hidden>
        <span id="banner"></span>
      </div>
      <div id="stage">
        <div class="caustics" aria-hidden="true"></div>
        <pre id="tank" aria-label="aquarium">Connexion au bac…</pre>
      </div>
      <div id="catch" hidden></div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
