<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>ASCII Aquarium — Debug chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        background:
          radial-gradient(ellipse 80% 40% at 50% -10%, rgba(80, 196, 255, 0.12), transparent 55%),
          #071018;
        color: #dff;
        padding: 20px 24px 32px;
        overflow: auto;
        font-family: Outfit, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #7ee8ff;
      }
      p { color: #9fb8c8; margin: 0 0 16px; }
      form, .row { display: flex; gap: 8px; margin: 8px 0 14px; flex-wrap: wrap; }
      input, button {
        font: 500 14px Outfit, sans-serif;
        padding: 8px 12px;
        background: rgba(10, 24, 34, 0.85);
        color: #e8f6ff;
        border: 1px solid rgba(156, 220, 255, 0.22);
        border-radius: 999px;
      }
      button { cursor: pointer; letter-spacing: 0.06em; }
      button:hover { border-color: #7ee8ff; color: #7ee8ff; }
      #log {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        white-space: pre-wrap;
        max-height: 160px;
        overflow: auto;
        color: #b7d4e4;
        font-size: 13px;
      }
      iframe {
        width: 1920px;
        height: 1080px;
        border: 0;
        transform: scale(0.5);
        transform-origin: top left;
        background: transparent;
      }
      .preview-wrap {
        width: 960px;
        height: 540px;
        overflow: hidden;
        border: 1px solid rgba(156, 220, 255, 0.2);
        border-radius: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Debug — chat Twitch</h1>
    <p>Sans token Twitch, envoie des commandes ici. L’overlay ci-dessous se met à jour en direct.</p>
    <form id="f">
      <input id="user" value="Alice" placeholder="pseudo" />
      <input id="msg" value="!fish" placeholder="!feed" style="min-width: 280px" />
      <button>Envoyer</button>
    </form>
    <div class="row">
      <button type="button" data-c="!fish">!fish</button>
      <button type="button" data-c="!feed">!feed</button>
      <button type="button" data-c="!aquarium">!aquarium</button>
      <button type="button" data-c="!myfish">!myfish</button>
      <button type="button" data-c="!treasure">!treasure</button>
      <button type="button" data-c="!catch">!catch</button>
      <button type="button" data-c="!race">!race</button>
      <button type="button" data-c="!shop">!shop</button>
      <button type="button" data-c="!help">!help</button>
    </div>
    <pre id="log"></pre>
    <div class="preview-wrap">
      <iframe src="/?preview=1" title="overlay"></iframe>
    </div>
    <script>
      const log = document.getElementById("log");
      async function send(user, message) {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user, message }),
        });
        const data = await res.json();
        log.textContent = `${user}: ${message}\n→ ${data.reply || "(pas de réponse)"}\n\n` + log.textContent;
      }
      document.getElementById("f").onsubmit = (e) => {
        e.preventDefault();
        send(document.getElementById("user").value, document.getElementById("msg").value);
      };
      document.querySelectorAll("button[data-c]").forEach((b) => {
        b.onclick = () => send(document.getElementById("user").value, b.dataset.c);
      });
    </script>
  </body>
</html>
